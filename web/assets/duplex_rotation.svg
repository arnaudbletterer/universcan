<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%" fill="none">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#dc2626" />
    </marker>
    <filter id="soft-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Left: Original Stack Position -->
  <g transform="translate(40, 40)">
    <text x="50" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="currentColor" letter-spacing="0.5">1. AS SCANNED (EXIT TRAY)</text>
    
    <!-- Shadow Sheet -->
    <rect x="4" y="4" width="92" height="128" rx="4" fill="#94a3b8" opacity="0.3" filter="url(#soft-shadow)"/>
    <rect x="2" y="2" width="92" height="128" rx="4" fill="#cbd5e1" opacity="0.6"/>
    <!-- Top Sheet -->
    <rect x="0" y="0" width="92" height="128" rx="4" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    
    <!-- Top Edge Header Bar -->
    <rect x="0" y="0" width="92" height="24" rx="4" fill="#2563eb"/>
    <text x="46" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff">TOP EDGE ↑</text>
    
    <!-- Document lines -->
    <line x1="14" y1="36" x2="78" y2="36" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="48" x2="68" y2="48" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="60" x2="74" y2="60" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="72" x2="56" y2="72" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Face Up Badge -->
    <rect x="18" y="90" width="56" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="46" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8">FACE UP</text>
  </g>

  <!-- Middle: 180° Flat Rotation Arc -->
  <g transform="translate(190, 60)">
    <!-- Flat Desk Plane Ellipse -->
    <ellipse cx="80" cy="55" rx="76" ry="38" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity="0.5"/>
    
    <!-- Rotation Arrow Path (clockwise on flat plane) -->
    <path d="M 30,55 A 50 25 0 0 1 130,55" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowhead)"/>
    <path d="M 130,55 A 50 25 0 0 1 30,55" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <!-- Center Label -->
    <rect x="36" y="38" width="88" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="80" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">SPIN 180° FLAT</text>
    <text x="80" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Like a steering wheel</text>
  </g>

  <!-- Right: Rotated Stack Ready for Feeder -->
  <g transform="translate(390, 40)">
    <text x="50" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="currentColor" letter-spacing="0.5">2. RE-INSERT INTO FEEDER</text>
    
    <!-- Shadow Sheet -->
    <rect x="4" y="4" width="92" height="128" rx="4" fill="#94a3b8" opacity="0.3" filter="url(#soft-shadow)"/>
    <rect x="2" y="2" width="92" height="128" rx="4" fill="#cbd5e1" opacity="0.6"/>
    <!-- Top Sheet (Rotated 180°) -->
    <rect x="0" y="0" width="92" height="128" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    
    <!-- Face Up Badge (Still Face Up) -->
    <rect x="18" y="18" width="56" height="20" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="46" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#15803d">STILL FACE UP</text>
    
    <!-- Inverted Document lines -->
    <line x1="14" y1="56" x2="56" y2="56" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="68" x2="74" y2="68" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="80" x2="68" y2="80" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="92" x2="78" y2="92" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Bottom Edge Bar (Where Top Edge Moved) -->
    <rect x="0" y="104" width="92" height="24" rx="4" fill="#16a34a"/>
    <text x="46" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff">TOP EDGE ↓</text>
  </g>

  <!-- Bottom Guidance Bars: Do vs Don't -->
  <g transform="translate(40, 205)">
    <!-- Do Banner -->
    <rect x="0" y="0" width="220" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="24" cy="26" r="10" fill="#16a34a"/>
    <path d="M19 26 l4 4 l7 -7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="44" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#14532d">CORRECT: Rotate Flat</text>
    <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="500" fill="#166534">Keep paper resting flat on table</text>

    <!-- Don't Banner -->
    <rect x="240" y="0" width="220" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <circle cx="264" cy="26" r="10" fill="#dc2626"/>
    <path d="M259 21 l10 10 M269 21 l-10 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="284" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#7f1d1d">DO NOT FLIP OVER</text>
    <text x="284" y="38" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="500" fill="#991b1b">Do not turn sheets upside down</text>
  </g>
</svg>
