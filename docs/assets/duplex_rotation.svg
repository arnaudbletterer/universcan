     inkscape:window-height="1362"
     inkscape:window-x="-8"
     inkscape:window-y="15"
     inkscape:window-maximized="1"
     inkscape:current-layer="g27" />
  <defs
     id="defs3">
    <!-- Arrowhead markers -->
    <marker
       id="arrow-blue"
       markerWidth="8"
       markerHeight="8"
       refX="6"
       refY="4"
       orient="auto">
      <polygon
         points="0 1, 8 4, 0 7"
         fill="#2563eb"
         id="polygon1" />
    </marker>
    <marker
       id="arrow-green"
       markerWidth="8"
       markerHeight="8"
       refX="6"
       refY="4"
       orient="auto">
      <polygon
         points="0 1, 8 4, 0 7"
         fill="#16a34a"
         id="polygon2" />
    </marker>
    <marker
       id="arrow-guide"
       markerWidth="6"
       markerHeight="6"
       refX="5"
       refY="3"
       orient="auto">
      <polygon
         points="0 1, 6 3, 0 5"
         fill="#94a3b8"
         id="polygon3" />
    </marker>
    <!-- Filters -->
    <filter
       id="soft-shadow"
       x="-15%"
       y="-15%"
       width="130%"
       height="130%">
      <feDropShadow
         dx="0"
         dy="2"
         stdDeviation="3"
         flood-opacity="0.10" />
    </filter>
    <filter
       id="stack-turn-shadow"
       x="-25%"
       y="-25%"
       width="150%"
       height="150%">
      <feDropShadow
         dx="0"
         dy="5"
         stdDeviation="6"
         flood-color="#0f172a"
         flood-opacity="0.16" />
    </filter>
    <style
       id="style3">
      /* Smooth 180° flat rotation like a turntable / steering wheel */
      @keyframes spinStack180 {
        0%, 18% {
          transform: rotate(0deg);
          opacity: 1;
        }
        55%, 85% {
          transform: rotate(180deg);
          opacity: 1;
        }
        94% {
          transform: rotate(180deg);
          opacity: 0;
        }
        97% {
          transform: rotate(0deg);
          opacity: 0;
        }
        100% {
          transform: rotate(0deg);
          opacity: 1;
        }
      }

      /* Color shift on the rotating header: starts Blue (0°), becomes Green (180°), resets to Blue while hidden */
      @keyframes headerShift {
        0%, 18% {
          fill: #2563eb;
        }
        55%, 85% {
          fill: #16a34a;
        }
        94% {
          fill: #16a34a;
        }
        96%, 100% {
          fill: #2563eb;
        }
      }

      /* Animated arrow flow */
      @keyframes dashFlow {
        from {
          stroke-dashoffset: 32;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      /* Pulse on turntable ring */
      @keyframes ringPulse {
        0%, 100% {
          stroke: #93c5fd;
          stroke-opacity: 0.6;
        }
        50% {
          stroke: #3b82f6;
          stroke-opacity: 1;
        }
      }

      .animated-stack {
        animation: spinStack180 4.2s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
        transform-origin: 280px 104px;
      }

      .animated-bar {
        animation: headerShift 4.2s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
      }

      .flowing-arrow {
        stroke-dasharray: 8 5;
        animation: dashFlow 1.8s linear infinite;
      }

      .turntable-border {
        animation: ringPulse 2.8s ease-in-out infinite;
      }
    </style>
  </defs>
  <!-- ======================================================== -->
